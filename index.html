<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Bank Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0d1420;        /* deep bank-ledger navy */
    --ink-2: #131c2c;
    --line: #24304a;
    --paper: #e8e4da;      /* statement paper text */
    --muted: #8b93a7;
    --brass: #c9a24b;      /* nameplate brass accent */
    --brass-dim: #8a7136;
    --refuse: #d97862;
    --ok: #6fae8f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 24px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.2px;
    color: var(--brass);
  }
  header span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 140px;
  }
  .msg { margin-bottom: 18px; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .msg.user { text-align: right; }
  .bubble {
    display: inline-block;
    text-align: left;
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.55;
    font-size: 15px;
  }
  .user .bubble { background: var(--line); border-bottom-right-radius: 3px; }
  .bot .bubble {
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
    font-variant-numeric: tabular-nums;
  }
  .bot.refused .bubble { border-color: var(--refuse); }
  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .sources b {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    border-radius: 4px;
    padding: 3px 8px;
  }
  .chip.none { color: var(--refuse); border-color: var(--refuse); }
  .status { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
  .status.ok { color: var(--ok); }
  .status.no { color: var(--refuse); }
  .suggest {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 6px 0 22px;
  }
  .suggest button {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font: 500 13px "Inter", sans-serif;
    cursor: pointer;
  }
  .suggest button:hover, .suggest button:focus-visible { border-color: var(--brass); color: var(--paper); outline: none; }
  form.ask {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, var(--ink) 30%);
    padding: 28px 20px 24px;
  }
  .ask .row {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .ask input {
    flex: 1;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--paper);
    padding: 14px 16px;
    font: 15px "Inter", sans-serif;
  }
  .ask input:focus { outline: none; border-color: var(--brass); }
  .ask button {
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font: 600 15px "Inter", sans-serif;
    cursor: pointer;
  }
  .ask button:disabled { opacity: .5; cursor: wait; }
  .typing { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Meridian Bank</h1>
  <span>Grounded assistant &middot; demo</span>
</header>

<main id="chat">
  <div class="msg bot">
    <div class="bubble">Ask me about Meridian accounts, cards, loans, or fees. Every answer is grounded in the bank's knowledge base, and I'll show you the sources. If I don't know, I say so.</div>
  </div>
  <div class="suggest" id="suggest">
    <button type="button">What does the Horizon credit card cost per year?</button>
    <button type="button">Am I eligible for a personal loan on a 55,000 salary?</button>
    <button type="button">What is your CEO's salary?</button>
  </div>
</main>

<form class="ask" id="form">
  <div class="row">
    <input id="input" placeholder="Ask about accounts, cards, loans, fees..." autocomplete="off" maxlength="500" />
    <button id="send" type="submit">Ask</button>
  </div>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const suggest = document.getElementById("suggest");

suggest.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") { input.value = e.target.textContent; form.requestSubmit(); }
});

function add(html, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  add(`<div class="bubble">${esc(q)}</div>`, "user");
  input.value = "";
  send.disabled = true;
  const wait = add(`<div class="bubble typing">Checking the knowledge base…</div>`, "bot");

  try {
    const res = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q }),
    });
    const data = await res.json();
    wait.remove();

    const grounded = data.grounded;
    const chips = grounded
      ? data.sources.map((s) => `<span class="chip">${esc(s)}</span>`).join("")
      : `<span class="chip none">no matching source</span>`;
    const status = grounded
      ? `<span class="status ok">grounded</span>`
      : `<span class="status no">out of scope</span>`;

    add(
      `<div class="bubble">${esc(data.answer)}</div>
       <div class="sources"><b>Sources</b>${chips}${status}</div>`,
      "bot" + (grounded ? "" : " refused")
    );
  } catch {
    wait.remove();
    add(`<div class="bubble">Something went wrong reaching the assistant. Try again.</div>`, "bot refused");
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
